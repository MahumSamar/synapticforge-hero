<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SynapticForge — Machines that empathize</title>
<meta name="description" content="Bringing people and machines together to shape a brighter, more harmonious tomorrow.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b0b0c;
    --muted: #8a8a8e;
    --pill: #ededee;
    --line: #77777b;
    --bg: #ffffff;
    --pad: clamp(16px, 2.7vw, 34px);
    --touch: 0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 480px;
    overflow: hidden;
    isolation: isolate;
  }

  /* ---------- Nav ---------- */
  .nav {
    position: absolute;
    inset: 0 0 auto 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px var(--pad);
    font-size: 13px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    letter-spacing: -0.02em;
    margin-right: 20px;
    white-space: nowrap;
  }
  .brand svg { width: 42px; height: 26px; flex: none; }
  .pill {
    height: 50px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    white-space: nowrap;
  }
  .pill-menu {
    background: var(--ink);
    color: #fff;
    padding: 0 24px 0 6px;
    gap: 18px;
    transition: transform .3s ease;
  }
  .pill-menu:hover { transform: scale(1.03); }
  .pill-menu .dot {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #fff;
    display: grid;
    place-items: center;
  }
  .pill-menu .dot::after {
    content: "";
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--ink);
  }
  .pill-links {
    background: var(--pill);
    padding: 0 28px;
    gap: 38px;
  }
  .pill-links a, .pill-cta { transition: opacity .2s ease; }
  .pill-links a:hover { opacity: .55; }
  .pill-cta {
    margin-left: auto;
    background: var(--pill);
    padding: 0 46px 0 6px;
    gap: 46px;
  }
  .pill-cta:hover { opacity: .8; }
  .pill-cta .ico {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--ink);
    display: grid;
    place-items: center;
    flex: none;
  }
  .pill-cta .ico svg { width: 18px; height: 18px; }

  /* ---------- Hero ---------- */
  .orb {
    position: absolute;
    left: 50%;
    top: 46%;
    width: min(34vw, 62vh);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    z-index: 0;
    pointer-events: none;
  }
  .orb::before, .orb::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
  }
  /* iridescent rim */
  .orb::before {
    background: conic-gradient(from 0deg,
      #ffd9c2, #f3d7ff, #cfd8ff, #ffffff, #ffe8c9, #d9d4ff, #ffd9c2);
    -webkit-mask: radial-gradient(closest-side, transparent 70%, #000 86%, transparent 100%);
            mask: radial-gradient(closest-side, transparent 70%, #000 86%, transparent 100%);
    filter: blur(14px);
    opacity: .75;
    animation: spin 14s linear infinite;
  }
  /* warm core that brightens as the fingertips meet */
  .orb::after {
    inset: 14%;
    background: radial-gradient(closest-side,
      rgba(255, 196, 150, .95), rgba(255, 222, 196, .55) 45%, rgba(255, 255, 255, 0) 100%);
    filter: blur(18px);
    opacity: calc(.18 + var(--touch) * .7);
    transform: scale(calc(.8 + var(--touch) * .3));
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .title {
    position: absolute;
    left: 50%;
    top: 43%;
    transform: translate(-50%, -50%);
    z-index: 1;
    text-align: center;
    font-weight: 600;
    font-size: clamp(34px, 5vw, 76px);
    line-height: 1.05;
    letter-spacing: -0.035em;
    white-space: nowrap;
  }
  .title span { display: block; }
  .title .soft { color: #b9b9bd; }
  .title .line { animation: rise 1.1s cubic-bezier(.2, .7, .2, 1) both; }
  .title .line:nth-child(2) { animation-delay: .25s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(.45em); filter: blur(8px); }
    to   { opacity: 1; transform: none; filter: none; }
  }

  #scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: opacity .8s ease;
  }
  #scene.ready { opacity: 1; }

  /* ---------- Footer row ---------- */
  .foot {
    position: absolute;
    inset: auto 0 0 0;
    z-index: 4;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    padding: 0 var(--pad) clamp(24px, 5.2vh, 44px);
    animation: rise 1.1s .5s cubic-bezier(.2, .7, .2, 1) both;
  }
  .foot .eyebrow {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 26px;
  }
  .foot p {
    font-size: clamp(17px, 1.65vw, 21px);
    line-height: 1.12;
    letter-spacing: -0.02em;
    max-width: 17em;
  }
  .foot .rule {
    width: 1px;
    height: 42px;
    background: var(--ink);
    justify-self: center;
  }
  .tags {
    justify-self: end;
    display: flex;
    gap: 5px;
    margin-bottom: -4px;
  }
  .tags a {
    height: 50px;
    padding: 0 28px;
    border: 1px solid var(--line);
    border-radius: 999px;
    display: grid;
    place-items: center;
    font-size: 13px;
    color: #6c6c70;
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  .tags a:hover { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1000px) {
    .pill-links { display: none; }
    .pill-cta { padding-right: 26px; gap: 16px; }
  }
  @media (max-width: 760px) {
    .nav { padding-top: 14px; gap: 8px; }
    .brand { font-size: 16px; margin-right: auto; }
    .brand svg { width: 34px; height: 21px; }
    .pill { height: 44px; }
    .pill-menu { padding: 0 18px 0 5px; gap: 12px; }
    .pill-menu .dot, .pill-cta .ico { width: 34px; height: 34px; }
    .pill-cta { margin-left: 0; padding: 0 5px; }
    .pill-cta span.label { display: none; }
    .orb { width: min(78vw, 46vh); top: 42%; }
    .title { top: 39%; font-size: clamp(26px, 8.8vw, 56px); }
    .foot {
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .foot .eyebrow { margin-bottom: 12px; }
    .foot .rule { display: none; }
    .tags { justify-self: start; flex-wrap: wrap; margin-bottom: 0; }
    .tags a { height: 42px; padding: 0 20px; }
  }
  @media (max-width: 380px) {
    .brand span { display: none; }
  }
  @media (max-height: 560px) and (orientation: landscape) {
    .foot .eyebrow { margin-bottom: 8px; }
    .foot p { font-size: 15px; }
    .tags a { height: 40px; padding: 0 18px; }
    .title { font-size: clamp(28px, 9vh, 56px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .orb::before, .title .line, .foot { animation: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <header class="nav">
    <a class="brand" href="#" aria-label="SynapticForge home">
      <svg viewBox="0 0 42 26" fill="currentColor" aria-hidden="true">
        <path d="M1 15.5C1 9.7 5.7 5 11.5 5c3.3 0 5.8 1.4 7.9 3.6l-5 4.9c-.9-.9-1.7-1.5-2.9-1.5-1.9 0-3.5 1.6-3.5 3.5H1Z"/>
        <path d="M41 10.5C41 16.3 36.3 21 30.500 21c-3.300 0-5.800-1.400-7.900-3.600l5-4.900c.9.9 1.700 1.500 2.900 1.500 1.900 0 3.500-1.600 3.500-3.500H41Z"/>
        <path d="M14.200 15.900 19.300 10.900l4.200 4.200-5.100 5z"/>
      </svg>
      <span>SynapticForge</span>
    </a>
    <button class="pill pill-menu" type="button"><i class="dot"></i>More</button>
    <nav class="pill pill-links" aria-label="Primary">
      <a href="#">Frontier Science</a>
      <a href="#">Learning AI</a>
    </nav>
    <a class="pill pill-cta" href="#" aria-label="Flexible Platforms">
      <i class="ico">
        <svg viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.5" aria-hidden="true">
          <rect x="4" y="4" width="10" height="10" rx="1.5" transform="rotate(45 9 9)"/>
        </svg>
      </i>
      <span class="label">Flexible Platforms</span>
    </a>
  </header>

  <div class="orb" aria-hidden="true"></div>

  <h1 class="title">
    <span class="line">SynapticForge</span>
    <span class="line"><span style="display:inline" class="soft">Machines</span> that empathize</span>
  </h1>

  <canvas id="scene" aria-hidden="true"></canvas>

  <footer class="foot">
    <div>
      <div class="eyebrow">Refined Craftsmanship</div>
      <p>Bringing people and machines together to shape a brighter, more harmonious tomorrow</p>
    </div>
    <i class="rule" aria-hidden="true"></i>
    <div class="tags">
      <a href="#">Automation</a>
      <a href="#">ML</a>
      <a href="#">Hardware</a>
    </div>
  </footer>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// 3D models generated with Higgsfield (image -> 3D), loaded straight from the returned URLs.
const HANDS = [
  {
    url: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261013_135027_b1d2981c-6b6a-45f7-875c-0cf7bb60077c.glb',
    side: -1,                       // comes in from the left
    rot: [0, -Math.PI / 2, 0],       // model space -> arm along X, fingertip towards centre
    tip: [-0.045, 0.045],           // fingertip rest position, as a fraction of the viewport
    phase: 0
  },
  {
    url: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261013_135043_df817596-56b7-4395-b5bb-9b753b141854.glb',
    side: 1,                        // comes in from the right
    rot: [0, -Math.PI / 2, 0],
    tip: [0.055, 0.05],
    phase: 1.7
  }
];

// Loop timeline in seconds: wait off-screen, reach in, hold the touch, pull back.
const T = { wait: 0.5, enter: 2.9, hold: 1.9, exit: 2.5 };
const CYCLE = T.wait + T.enter + T.hold + T.exit;

const canvas = document.getElementById('scene');
const stage = canvas.parentElement;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(0.5, 3, 4);
scene.add(key);
const warm = new THREE.PointLight(0xffc49a, 0, 6, 2);   // lights up where the fingers meet
warm.position.set(0, 0.2, 1.2);
scene.add(warm);

const CAM_Z = 10;
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
camera.position.z = CAM_Z;
const view = { w: 1, h: 1 };          // visible world size at z = 0

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  view.h = 2 * CAM_Z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  view.w = view.h * camera.aspect;
}
resize();
addEventListener('resize', resize);

// Wrap a loaded model so it is 1 unit long along X with its fingertip at the origin.
function buildRig(gltf, cfg) {
  const orient = new THREE.Group();
  orient.add(gltf.scene);
  orient.rotation.set(...cfg.rot);
  orient.updateMatrixWorld(true);

  const length = new THREE.Box3().setFromObject(orient).getSize(new THREE.Vector3()).x;
  const tip = new THREE.Vector3(), v = new THREE.Vector3();
  let best = -Infinity;
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    o.material.envMapIntensity = 1.15;
    const pos = o.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      const reach = -cfg.side * v.x;            // how far towards the centre of the screen
      if (reach > best) { best = reach; tip.copy(v); }
    }
  });
  orient.position.copy(tip).multiplyScalar(-1);

  const unit = new THREE.Group();
  unit.add(orient);
  unit.scale.setScalar(1 / length);

  const rig = new THREE.Group();
  rig.add(unit);
  rig.userData = cfg;
  return rig;
}

const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 4);

// 0 = fully withdrawn, 1 = fingertips meeting
function reachAt(t) {
  if (reduceMotion) return 1;
  t %= CYCLE;
  if (t < T.wait) return 0;
  t -= T.wait;
  if (t < T.enter) return easeOut(t / T.enter);
  t -= T.enter;
  if (t < T.hold) return 1;
  t -= T.hold;
  return 1 - easeInOut(t / T.exit);
}

const pointer = { x: 0, y: 0, sx: 0, sy: 0 };
addEventListener('pointermove', e => {
  pointer.x = e.clientX / innerWidth * 2 - 1;
  pointer.y = e.clientY / innerHeight * 2 - 1;
});

function pose(rig, p, time) {
  const { side, tip, phase } = rig.userData;
  const q = 1 - p;                                   // distance from the touch pose
  const length = Math.max(view.w * 0.54, view.h * 0.36);
  const float = Math.sin(time * 1.3 + phase);

  // swing in from the upper corner along an arc, settling level in the middle
  rig.position.set(
    tip[0] * view.w + side * q * (view.w * 0.5 + length * 0.12) + pointer.sx * 0.04 * side,
    tip[1] * view.h + q * view.h * 0.3 + Math.sin(p * Math.PI) * view.h * 0.05
      + float * view.h * 0.006 - pointer.sy * 0.04,
    q * 0.8
  );
  rig.rotation.set(
    q * 0.55 + float * 0.012,
    side * q * 0.75 + pointer.sx * 0.05,
    -side * (q * 0.8 + float * 0.01)
  );
  rig.scale.setScalar(length);
}

const rigs = [];
const clock = new THREE.Clock(false);

function frame() {
  const time = clock.getElapsedTime();
  const p = reachAt(time);
  pointer.sx += (pointer.x - pointer.sx) * 0.05;
  pointer.sy += (pointer.y - pointer.sy) * 0.05;
  for (const rig of rigs) pose(rig, p, time);

  const touch = THREE.MathUtils.smoothstep(p, 0.82, 1);
  warm.intensity = touch * 2.2;
  stage.style.setProperty('--touch', touch.toFixed(3));

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

const loader = new GLTFLoader();
Promise.all(HANDS.map(cfg => loader.loadAsync(cfg.url).then(gltf => buildRig(gltf, cfg))))
  .then(loaded => {
    for (const rig of loaded) { rigs.push(rig); scene.add(rig); }
    canvas.classList.add('ready');
    clock.start();
    frame();
  })
  .catch(err => console.error('Could not load the hand models', err));
</script>
</body>
</html>
